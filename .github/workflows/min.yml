name: min
on: workflow_dispatch
permissions:
  id-token: write
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo hello
          RESP=$(curl -sSL -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=north")
          echo "len=$(echo "$RESP" | jq -r '.value // empty' | wc -c)"
